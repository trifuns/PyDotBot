# This file is used to create and configure simulated DotBot instances for the simulator.
# It is only used when the flag `-p dotbot-simulator` is set, otherwise it is ignored.

[network]
pdr = 100              # packet delivery ratio for "default" network mode (0-100)
uplink_pdr = 100       # flat fallback PDR for DotBot→gateway in "mari" mode, used
                       # when pdr_by_distance_m below is unset
downlink_pdr = 100     # flat fallback PDR for gateway→DotBot in "mari" mode
# slot_duration_ms = 1.78  # optional override; default derives from the mari
                           # schedule (firmware mac.h), not hand-copied here
mqtt_latency_ms = 0.0  # one-way MQTT broker latency in ms (applied in both modes)
# schedule = "big"     # optional: force one of mari's tiny/medium/big/huge
                        # schedules; default auto-selects from the mari-mode
                        # fleet size
# mari_dir = "/path/to/mari"  # optional explicit mari firmware checkout;
                               # default resolves $MARI_FIRMWARE_DIR, then a
                               # sibling `mari/` directory, then a bundled
                               # generated snapshot
gateway_pos_x = 1000   # gateway position in mm, arena coordinates — the
gateway_pos_y = 1000   # reference point pdr_by_distance_m measures from
# pdr_by_distance_m = [[2.0, 98.6], [10.0, 94.3]]  # optional: derive per-bot
                        # "mari" mode PDR from its live distance to the
                        # gateway (linear interpolation, clamped outside the
                        # range) instead of the flat uplink_pdr/downlink_pdr
                        # above. Never a function of fleet size or schedule.

[[dotbots]]
address = "BADCAFE111111111" # DotBot unique address
calibrated = 0xff # optional, defaults to only first lighthouse calibrated
pos_x = 1000 # [0, 2_000] in mm
pos_y = 250 # [0, 2_000]
direction = 0 # [0, 360] in degrees, 0 is facing north, increasing clockwise
network_mode = "default" # optional, defaults to "default", can be set to "mari"

[[dotbots]]
address = "DEADBEEF22222222"
pos_x = 1500
pos_y = 200
direction = 180

[[dotbots]]
address = "B0B0F00D33333333"
pos_x = 1_500
pos_y = 1_500
direction = 180

[[dotbots]]
address = "BADC0DE444444444"
pos_x = 1_000
pos_y = 1_000
direction = 360
